<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SPARK · האזור האישי</title>
<link rel="icon" type="image/png" href="/assets/spark-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Heebo:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .portal { max-width: 1100px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); }
  .portal-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 72px; }
  .portal-hero { padding: 30px 0 26px; }
  .portal-hero h1 { font-size: clamp(50px, 9vw, 104px); line-height: .92; display: flex; flex-wrap: wrap; gap: .1em .25em; align-items: baseline; }
  .portal .videos { grid-template-columns: repeat(auto-fill, minmax(min(46%, 220px), 1fr)); gap: 18px; }
  .vid-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 14px; color: var(--muted); }
  .vid-meta b { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vid-meta span { white-space: nowrap; flex: none; }
  .vid-note { margin: 6px 0 0; padding: 10px 12px; border-radius: 12px; background: rgba(140, 40, 255, .12); border: 1px solid rgba(170, 70, 255, .3); font-size: 14px; line-height: 1.5; white-space: pre-line; color: var(--ink); }
  .phone-hint { font: 800 22px/1 var(--f-lat); letter-spacing: .06em; direction: ltr; unicode-bidi: isolate; color: #fff; }
  .resend { font-size: 14px; }
  .contact-us { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-top: 34px; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="app" id="app"><div class="loading" style="min-height:100svh"><span class="spinner"></span></div></div>

<dialog class="modal player" id="player">
  <video id="playerVideo" controls playsinline></video>
  <div class="player-bar"><b id="playerName"></b><div class="row"><a class="btn btn-ghost btn-sm" id="playerDl" href="#">הורדה</a><button class="btn btn-ghost btn-sm" type="button" data-close>סגירה</button></div></div>
</dialog>

<script src="/assets/client.js"></script>
</body>
</html>
