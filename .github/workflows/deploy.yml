name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # ודא שזה שם הבראנץ' הראשי שלך (main או master)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public' # אומר לגיטהאב לקחת רק את מה שבתוך public ולהפוך אותו לאתר הראשי!
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
