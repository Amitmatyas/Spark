name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_URL: https://sparks.qd.je

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same substitution Vercel does in vercel.json, with the custom domain
      - name: Fill in the site URL
        run: sed -i "s|__SITE_URL__|${SITE_URL}|g" public/index.html public/sitemap.xml public/robots.txt

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Only public/ is published; public/CNAME carries the custom domain
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
